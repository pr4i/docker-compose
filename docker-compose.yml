version: "3.8"

services:
  backend1:
    build: .
    ports:
      - "3003:8080"
    environment:
      - PORT=8080

  backend2:
    build: .
    ports:
      - "3001:8080"
    environment:
      - PORT=8080

  backend3:
    build: .
    ports:
      - "3002:8080"
    environment:
      - PORT=8080

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    depends_on:
      - backend1
      - backend2
      - backend3
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
